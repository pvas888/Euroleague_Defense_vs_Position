name: Update defense-vs-position page

on:
  schedule:
    - cron: "30 23 * * *"   # every night, 23:30 UTC (after the evening games)
    - cron: "0 8 * * *"     # every morning, 08:00 UTC (catches anything late)
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write            # the job saves the new page and data back to the repo

concurrency:
  group: update-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download new games and build the page
        env:
          DVP_POSITIONS_FILE: data/positions.csv
          DVP_OUTPUT_DIR: docs
          DVP_CACHE_DIR: data/cache
          DVP_SEASONS: "2026"
        run: python euroleague_defense_vs_position.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache docs/index.html
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
